<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Events Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    /* Top Bar with Home Button */
    .top-bar {
      max-width: 1000px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .home-btn {
      color: white;
      background: #002266;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
    }

    h1 {
      color: #002266;
      margin: 0;
    }

    /* Event Section Titles */
    h2 {
      color: #002266;
      border-bottom: 2px solid #002266;
      padding-bottom: 5px;
      margin-top: 30px;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Picture Grid for Each Event */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Image Style */
    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      background: white;
    }
  </style>
</head>
<body>

  <!-- TOP BAR WITH HOME BUTTON -->
  <div class="top-bar">
    <a href="index.html" class="home-btn">← Home</a>
    <h1>School Events Gallery</h1>
  </div>

  <!-- EVENT 1: GRADUATION -->
  <h2>Graduation Day</h2>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=500" alt="Graduation Ceremony">
    <img src="https://images.unsplash.com/photo-1541339907198-e08756defe43?w=500" alt="Graduates">
  </div>

  <!-- EVENT 2: SPORTS FESTIVAL -->
  <h2>Sportsfest & Intramurals</h2>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1577897113292-3b95936e52a6?w=500" alt="Sports Games">
    <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?w=500" alt="Outdoor Activities">
  </div>

  <!-- EVENT 3: CLASSROOM & LABS -->
  <h2>Academic & Science Fair</h2>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1580894732413-a70427753c1a?w=500" alt="Classroom Event">
    <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=500" alt="Science Experiment">
  </div>

</body>
</html>
